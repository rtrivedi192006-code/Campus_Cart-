$kind: http-request
name: Update Barter Status
method: PUT
url: '{{baseUrl}}/api/barter/{{barterId}}'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "accepted"
    }
